name: Build Horizon Mod (.hmod)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.95.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Install cargo-horizon-mod
        run: |
          cargo +1.95.0 install --locked --git https://github.com/horizon-rust/horizon cargo-horizon-mod

      - name: Build .hmod (WebAssembly)
        run: |
          cargo +1.95.0 horizon-mod build --wasm

      - name: Upload vein_miner.hmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: vein_miner-hmod
          path: target/horizon-mod/vein_miner.hmod
